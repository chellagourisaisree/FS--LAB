<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Product Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Product Calculator</h2>

        <div class="form-group">
            <label for="name">Product Name:</label>
            <input type="text" id="name" value="Sample Item">
        </div>

        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" value="1" min="1" step="1">
        </div>

        <div class="form-group">
            <label for="price">Price per Unit ($):</label>
            <input type="number" id="price" value="10.00" min="0" step="0.01">
        </div>

        <div class="result">
            Total: $<span id="total">10.00</span>
        </div>
    </div>

    <script>
        // Get references to elements
        var quantityInput = document.getElementById('quantity');
        var priceInput = document.getElementById('price');
        var totalDisplay = document.getElementById('total');

        // Function to calculate and update total
        function calculateTotal() {
            var quantity = Number(quantityInput.value);
            var price = Number(priceInput.value);
            
            var total = quantity * price;

            // Display total rounded to 2 decimal places
            totalDisplay.textContent = total.toFixed(2);
        }

        // Add input event listeners to recalculate dynamically
        quantityInput.addEventListener('input', calculateTotal);
        priceInput.addEventListener('input', calculateTotal);
    </script>

</body>
</html>
